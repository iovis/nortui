[package]
name = "nortui"
version = "0.1.0"
edition = "2024"
description = "A small searchable terminal widget for the NordVPN CLI"

[dependencies]
anyhow = "1"
# This reader returns on terminal EOF instead of spinning in Mio's read loop.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.profiling]
inherits = "release"
debug = true
