[package]
name = "nortui"
version = "0.1.0"
edition = "2024"
description = "A small searchable terminal widget for the NordVPN CLI"

[dependencies]
anyhow = "1"
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "macros", "signal", "io-util"] }
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
